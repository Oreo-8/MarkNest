  <g>
    <rect x="77" y="580" width="190" height="72" rx="10" fill="#fff5dc" stroke="#d5ad4c"/>
    <text x="172" y="609" text-anchor="middle" class="node-title">文档管理</text>
    <text x="172" y="631" text-anchor="middle" class="node-subtitle">useMarkdownDocument</text>
  </g>
  <g>
    <rect x="286" y="580" width="190" height="72" rx="10" fill="#fff5dc" stroke="#d5ad4c"/>
    <text x="381" y="609" text-anchor="middle" class="node-title">会话持久化</text>
    <text x="381" y="631" text-anchor="middle" class="node-subtitle">useEditorPersistence</text>
  </g>
  <g>
    <rect x="495" y="580" width="190" height="72" rx="10" fill="#fff5dc" stroke="#d5ad4c"/>
    <text x="590" y="609" text-anchor="middle" class="node-title">设置 / 权限 / 布局</text>
    <text x="590" y="631" text-anchor="middle" class="node-subtitle">useSettings 等 composables</text>
  </g>
  <g>
    <rect x="704" y="580" width="190" height="72" rx="10" fill="#fff5dc" stroke="#d5ad4c"/>
    <text x="799" y="609" text-anchor="middle" class="node-title">Markdown 渲染</text>
    <text x="799" y="631" text-anchor="middle" class="node-subtitle">markdown.ts</text>
  </g>

  <!-- Extension layer -->
  <rect x="985" y="278" width="410" height="420" rx="18" fill="#ffffff" stroke="#d8caec"/>
  <text x="1008" y="307" class="group-title" fill="#68439a">扩展协调层</text>
  <g>
    <rect class="node" x="1021" y="329" width="338" height="76" fill="#f2eafe" stroke="#a07acc"/>
    <text x="1190" y="358" text-anchor="middle" class="node-title">Service Worker</text>
    <text x="1190" y="381" text-anchor="middle" class="node-subtitle">background.ts</text>
  </g>
  <g>
    <rect x="1021" y="463" width="155" height="72" rx="10" fill="#f6f0fd" stroke="#b69bd5"/>
    <text x="1098" y="492" text-anchor="middle" class="node-title">AI 站点适配</text>
    <text x="1098" y="514" text-anchor="middle" class="node-subtitle">ai-sites.ts</text>
  </g>
  <g>
    <rect x="1204" y="463" width="155" height="72" rx="10" fill="#f6f0fd" stroke="#b69bd5"/>
    <text x="1281" y="492" text-anchor="middle" class="node-title">扩展声明</text>
    <text x="1281" y="514" text-anchor="middle" class="node-subtitle">manifest.json</text>
  </g>
  <g>
    <rect x="1021" y="580" width="338" height="72" rx="10" fill="#f6f0fd" stroke="#b69bd5"/>
    <text x="1190" y="609" text-anchor="middle" class="node-title">消息路由与浏览器操作</text>
    <text x="1190" y="631" text-anchor="middle" class="node-subtitle">新建·采集·权限·本地链接</text>
  </g>

  <!-- Browser layer -->
  <rect x="45" y="730" width="1350" height="145" rx="18" fill="#ffffff" stroke="#d6dae2"/>
  <text x="68" y="759" class="group-title" fill="#596579">浏览器与本地能力</text>
  <g>
    <rect x="78" y="781" width="278" height="66" rx="12" fill="#f5f6f8" stroke="#aeb6c2"/>
    <text x="217" y="807" text-anchor="middle" class="node-title">Chrome Extension APIs</text>
    <text x="217" y="829" text-anchor="middle" class="node-subtitle">Runtime / Tabs / Scripting / Downloads</text>
  </g>
  <g>
    <rect x="407" y="781" width="278" height="66" rx="12" fill="#f5f6f8" stroke="#aeb6c2"/>
    <text x="546" y="807" text-anchor="middle" class="node-title">本地存储</text>
    <text x="546" y="829" text-anchor="middle" class="node-subtitle">chrome.storage / localStorage / IndexedDB</text>
  </g>
  <g>
    <rect x="736" y="781" width="278" height="66" rx="12" fill="#f5f6f8" stroke="#aeb6c2"/>
    <text x="875" y="807" text-anchor="middle" class="node-title">文件系统</text>
    <text x="875" y="829" text-anchor="middle" class="node-subtitle">File System Access API / file://</text>
  </g>
  <g>
    <rect x="1065" y="781" width="278" height="66" rx="12" fill="#f5f6f8" stroke="#aeb6c2"/>
    <text x="1204" y="807" text-anchor="middle" class="node-title">受支持的 AI 网站</text>
    <text x="1204" y="829" text-anchor="middle" class="node-subtitle">ChatGPT / Gemini / DeepSeek / 千问等</text>
  </g>

