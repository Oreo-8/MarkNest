<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">MarkNest 代码模块设计图</title>
  <desc id="desc">展示 MarkNest 的入口层、应用编排层、业务模块层、扩展协调层以及浏览器能力之间的关系。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#24324a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68758a"/>
    </marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1c2b41; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #66758a; }
      .group-title { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      .node-title { font-size: 16px; font-weight: 700; }
      .node-subtitle { font-size: 12px; fill: #66758a; }
      .edge-label { font-size: 12px; fill: #56657a; }
      .edge { fill: none; stroke: #68758a; stroke-width: 1.8; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #8a95a6; stroke-width: 1.6; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .node { rx: 12; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1440" height="920" fill="url(#background)"/>
  <text x="60" y="58" class="title">MarkNest 代码模块设计图</text>
  <text x="60" y="84" class="subtitle">Vue 3 + TypeScript + Chrome Extension Manifest V3 · 当前代码结构</text>

  <!-- Entry layer -->
  <rect x="45" y="112" width="1350" height="138" rx="18" fill="#ffffff" stroke="#c9d7ec"/>
  <text x="68" y="139" class="group-title" fill="#376aa6">入口层</text>
  <g>
    <rect class="node" x="78" y="158" width="260" height="66" fill="#e8f1ff" stroke="#6d9bd2"/>
    <text x="208" y="184" text-anchor="middle" class="node-title">扩展弹窗</text>
    <text x="208" y="205" text-anchor="middle" class="node-subtitle">popup/PopupApp.vue</text>
  </g>
  <g>
    <rect class="node" x="410" y="158" width="260" height="66" fill="#e8f1ff" stroke="#6d9bd2"/>
    <text x="540" y="184" text-anchor="middle" class="node-title">独立编辑页</text>
    <text x="540" y="205" text-anchor="middle" class="node-subtitle">main.ts</text>
  </g>
  <g>
    <rect class="node" x="742" y="158" width="260" height="66" fill="#e8f1ff" stroke="#6d9bd2"/>
    <text x="872" y="184" text-anchor="middle" class="node-title">本地文件接管</text>
    <text x="872" y="205" text-anchor="middle" class="node-subtitle">file-viewer.ts</text>
  </g>
  <g>
    <rect class="node" x="1074" y="158" width="260" height="66" fill="#e8f1ff" stroke="#6d9bd2"/>
    <text x="1204" y="184" text-anchor="middle" class="node-title">AI 页面采集</text>
    <text x="1204" y="205" text-anchor="middle" class="node-subtitle">ai-capture.ts</text>
  </g>

  <!-- App layer -->
  <rect x="45" y="278" width="905" height="420" rx="18" fill="#ffffff" stroke="#c8dfd1"/>
  <text x="68" y="307" class="group-title" fill="#31724c">编辑器应用</text>
  <g>
    <rect class="node" x="328" y="329" width="340" height="76" fill="#eaf8f0" stroke="#65ad7e"/>
    <text x="498" y="358" text-anchor="middle" class="node-title">应用状态与流程编排</text>
    <text x="498" y="381" text-anchor="middle" class="node-subtitle">App.vue</text>
  </g>

